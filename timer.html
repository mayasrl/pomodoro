<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro - Timer</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="dark">
    <header>
        <a href="index.html" class="logo">Pomodoro</a>
        <button id="theme-toggle" class="theme-btn" aria-label="Alternar tema">
            <svg class="sun-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="5"/>
                <line x1="12" y1="1" x2="12" y2="3"/>
                <line x1="12" y1="21" x2="12" y2="23"/>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                <line x1="1" y1="12" x2="3" y2="12"/>
                <line x1="21" y1="12" x2="23" y2="12"/>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
            <svg class="moon-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
        </button>
    </header>

    <main class="timer-main">
        <div class="container-small">
            <div class="timer-header">
                <h1 class="title-gradient">Pomodoro</h1>
                <p class="subtitle-small">Encontre seu foco com sons relaxantes</p>
                <div class="pet-display" id="current-pet"></div>
            </div>

            <div class="timer-card rainbow-border">
                <div class="timer-content">
                    <div class="mode-selector">
                        <button class="mode-btn active" data-mode="focus">Foco</button>
                        <button class="mode-btn" data-mode="short">Pausa Curta</button>
                        <button class="mode-btn" data-mode="long">Pausa Longa</button>
                    </div>

                    <div class="timer-display" id="timer">25:00</div>
                    
                    <div class="cycles-info">
                        <span class="pulse-dot"></span>
                        Ciclos completados: <span id="cycles-count">0</span>
                    </div>

                    <div class="timer-controls">
                        <button class="control-btn primary" id="play-pause">
                            <svg class="play-icon" width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
                                <polygon points="5 3 19 12 5 21 5 3"/>
                            </svg>
                            <svg class="pause-icon" width="32" height="32" viewBox="0 0 24 24" fill="currentColor" style="display:none;">
                                <rect x="6" y="4" width="4" height="16"/>
                                <rect x="14" y="4" width="4" height="16"/>
                            </svg>
                        </button>
                        <button class="control-btn secondary" id="reset">
                            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="23 4 23 10 17 10"/>
                                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
                            </svg>
                        </button>
                        <button class="control-btn secondary" id="settings">
                            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="3"/>
                                <path d="M12 1v6m0 6v6m-8-7h6m6 0h6m-13.66 5.66l4.24-4.24m4.24 0l4.24 4.24M6.34 6.34l4.24 4.24m4.24-4.24l4.24-4.24"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <div class="sounds-card rainbow-border">
                <div class="sounds-content">
                    <div class="sounds-header">
                        <h3 class="sounds-title">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
                            </svg>
                            Sons Ambientes
                        </h3>
                        <div class="volume-controls">
                            <button id="mute-btn" class="icon-btn">
                                <svg class="volume-on" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
                                </svg>
                                <svg class="volume-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
                                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                                    <line x1="23" y1="9" x2="17" y2="15"/>
                                    <line x1="17" y1="9" x2="23" y2="15"/>
                                </svg>
                            </button>
                            <input type="range" id="volume-slider" min="0" max="100" value="50" class="volume-slider">
                        </div>
                    </div>
                    <div class="sounds-grid" id="sounds-grid"></div>
                </div>
            </div>
        </div>
    </main>

    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Configurações</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="setting-group">
                    <label for="focus-time">Tempo de Foco (minutos)</label>
                    <input type="number" id="focus-time" min="1" max="60" value="25">
                </div>
                <div class="setting-group">
                    <label for="short-break">Pausa Curta (minutos)</label>
                    <input type="number" id="short-break" min="1" max="30" value="5">
                </div>
                <div class="setting-group">
                    <label for="long-break">Pausa Longa (minutos)</label>
                    <input type="number" id="long-break" min="1" max="60" value="15">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-save">Salvar</button>
            </div>
        </div>
    </div>

    <footer>
        Feito com 💛 por @mayasrl
    </footer>

    <script src="js/theme.js"></script>
    <script src="js/pets.js"></script>
    <script src="js/sound-icons.js"></script>
    <script src="js/sounds.js"></script>
    <script src="js/timer.js"></script>
</body>
</html>
